<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g28RoofGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A87724"/>
      <stop offset="38%" stop-color="#D49B35"/>
      <stop offset="68%" stop-color="#F2E2BE"/>
      <stop offset="100%" stop-color="#D49B35"/>
    </linearGradient>
    <radialGradient id="g28RoofGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#E6C675" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D49B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon tile (exact G28Mark: rounded-[22%] on #08251C) -->
  <rect width="64" height="64" rx="14.08" fill="#08251C"/>

  <!-- exact G28Roof brand mark, centred at 82% of the tile -->
  <svg x="11.815" y="5.76" width="40.37" height="52.48" viewBox="0 0 100 130" overflow="visible">
    <!-- roofline -->
    <path
      d="M6 9 L24 9 L94 45 L94 122"
      fill="none"
      stroke="url(#g28RoofGold)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- pendant cord from the apex -->
    <line x1="24" y1="9" x2="24" y2="58" stroke="#D49B35" stroke-width="2.4"/>

    <!-- shade -->
    <path d="M10 60 L38 60 L44 78 L4 78 Z" fill="url(#g28RoofGold)"/>
    <path d="M10 60 L38 60 L39 65 L9 65 Z" fill="#051812" opacity="0.28"/>

    <!-- bulb + warm glow -->
    <circle cx="24" cy="84" r="15" fill="url(#g28RoofGlow)" opacity="0.85"/>
    <circle cx="24" cy="84" r="4.4" fill="#F2E2BE"/>
  </svg>
</svg>
